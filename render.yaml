services:
  - type: web
    name: lingo-vocab-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
